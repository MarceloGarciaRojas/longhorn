name: nexi-local

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: nexi_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexi_postgres_local
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexi_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - nexi_postgres_data:/var/lib/postgresql/data

volumes:
  nexi_postgres_data:
